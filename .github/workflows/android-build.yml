name: XSD BOOST Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build type'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Build Release APK (unsigned unless signing secrets are configured)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/upload-key.jks"
            export KEY_ALIAS="${KEY_ALIAS:-upload}"
            gradle --no-daemon :app:assembleRelease
          else
            echo "No Android signing secrets found; creating an unsigned release APK."
            gradle --no-daemon :app:assembleRelease
          fi

      - name: Collect APK files
        if: always()
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          ls -lah dist || true

      - name: Upload APK artifact
        if: success() && hashFiles('dist/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xsd-boost-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
